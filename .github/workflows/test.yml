name: TEST Deployment

on:
  push:
    branches:
      - test

jobs:
  build-and-deploy:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build WAR
        run: mvn clean package

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.TEST_SSH_KEY }}" > ~/.ssh/test_key
          chmod 600 ~/.ssh/test_key
          ssh-keyscan -H ${{ secrets.TEST_HOST }} >> ~/.ssh/known_hosts

      - name: Copy WAR to TEST EC2
        run: |
          scp -i ~/.ssh/test_key \
            target/*.war \
            ec2-user@${{ secrets.TEST_HOST }}:/tmp/neontask-test.war

      - name: Deploy to Tomcat
        run: |
          ssh -i ~/.ssh/test_key \
            ec2-user@${{ secrets.TEST_HOST }} << 'EOF'

            sudo systemctl stop tomcat

            sudo rm -rf /opt/tomcat/webapps/neontask-test
            sudo rm -f /opt/tomcat/webapps/neontask-test.war

            sudo mv /tmp/neontask-test.war \
              /opt/tomcat/webapps/neontask-test.war

            sudo chown tomcat:tomcat \
              /opt/tomcat/webapps/neontask-test.war

            sudo systemctl start tomcat

            sudo systemctl status tomcat --no-pager

            echo "TEST deployment completed!"

          EOF


      - name: TEST Deployment Successful
        run: |
          echo "========================================"
          echo "       TEST DEPLOYMENT SUCCESSFUL"
          echo "========================================"
          echo "http://${{ secrets.TEST_HOST }}:8080/neontask-test"
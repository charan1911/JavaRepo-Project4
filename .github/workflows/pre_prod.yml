name: PREPROD Deployment

on:
  push:
    branches:
      - preprod

jobs:
  build-and-deploy:

    runs-on: ubuntu-latest

    # GitHub Environment
    environment:
      name: preprod

    steps:

      # =====================================================
      # CHECKOUT
      # =====================================================

      - name: Checkout Code
        uses: actions/checkout@v4


      # =====================================================
      # JAVA 17
      # =====================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven


      # =====================================================
      # MAVEN BUILD
      # =====================================================

      - name: Build Java Application
        run: |
          mvn clean package


      # =====================================================
      # CHECK WAR
      # =====================================================

      - name: Check WAR File
        run: |
          ls -lh target/
          test -f target/*.war


      # =====================================================
      # CONFIGURE SSH
      # =====================================================

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.PREPROD_SSH_KEY }}" > ~/.ssh/preprod_key

          chmod 600 ~/.ssh/preprod_key

          ssh-keyscan -H "${{ secrets.PREPROD_HOST }}" >> ~/.ssh/known_hosts


      # =====================================================
      # TEST SSH CONNECTION
      # =====================================================

      - name: Test SSH Connection
        run: |
          ssh \
            -i ~/.ssh/preprod_key \
            -o StrictHostKeyChecking=yes \
            ec2-user@${{ secrets.PREPROD_HOST }} \
            "echo 'SSH connection successful'"


      # =====================================================
      # COPY WAR TO EC2
      # =====================================================

      - name: Copy WAR to PREPROD EC2
        run: |
          scp \
            -i ~/.ssh/preprod_key \
            -o StrictHostKeyChecking=yes \
            target/*.war \
            ec2-user@${{ secrets.PREPROD_HOST }}:/tmp/neontask-preprod.war


      # =====================================================
      # DEPLOY TO TOMCAT
      # =====================================================

      - name: Deploy to Tomcat
        run: |
          ssh \
            -i ~/.ssh/preprod_key \
            -o StrictHostKeyChecking=yes \
            ec2-user@${{ secrets.PREPROD_HOST }} << 'EOF'

            echo "Stopping Tomcat..."

            sudo systemctl stop tomcat || true


            echo "Removing old application..."

            sudo rm -rf /opt/tomcat/webapps/neontask-preprod

            sudo rm -f /opt/tomcat/webapps/neontask-preprod.war


            echo "Copying new WAR..."

            sudo mv \
              /tmp/neontask-preprod.war \
              /opt/tomcat/webapps/neontask-preprod.war


            echo "Setting permissions..."

            sudo chown \
              tomcat:tomcat \
              /opt/tomcat/webapps/neontask-preprod.war


            echo "Starting Tomcat..."

            sudo systemctl start tomcat


            echo "Waiting for Tomcat..."

            sleep 10


            echo "Checking Tomcat..."

            sudo systemctl status tomcat --no-pager


            echo "PREPROD deployment completed!"

          EOF


      # =====================================================
      # DEPLOYMENT RESULT
      # =====================================================

      - name: Deployment Successful
        run: |
          echo "=============================================="
          echo "       PREPROD DEPLOYMENT SUCCESSFUL"
          echo "=============================================="
          echo ""
          echo "Application:"
          echo "http://${{ secrets.PREPROD_HOST }}:8080/neontask-preprod"
          echo ""
          echo "Tomcat:"
          echo "Port 8080"
          echo "=============================================="
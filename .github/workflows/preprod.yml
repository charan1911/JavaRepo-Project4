name: PREPROD Deployment

on:
  push:
    branches:
      - preprod

jobs:
  build-and-deploy:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build WAR
        run: mvn clean package

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PREPROD_SSH_KEY }}" > ~/.ssh/preprod_key
          chmod 600 ~/.ssh/preprod_key
          ssh-keyscan -H ${{ secrets.PREPROD_HOST }} >> ~/.ssh/known_hosts

      - name: Copy WAR to PREPROD EC2
        run: |
          scp -i ~/.ssh/preprod_key \
            target/*.war \
            ec2-user@${{ secrets.PREPROD_HOST }}:/tmp/neontask-preprod.war

      - name: Deploy to Tomcat
        run: |
          ssh -i ~/.ssh/preprod_key \
            ec2-user@${{ secrets.PREPROD_HOST }} << 'EOF'

            sudo systemctl stop tomcat

            sudo rm -rf /opt/tomcat/webapps/neontask-preprod
            sudo rm -f /opt/tomcat/webapps/neontask-preprod.war

            sudo mv /tmp/neontask-preprod.war \
              /opt/tomcat/webapps/neontask-preprod.war

            sudo chown tomcat:tomcat \
              /opt/tomcat/webapps/neontask-preprod.war

            sudo systemctl start tomcat

            sudo systemctl status tomcat --no-pager

            echo "PREPROD deployment completed!"

          EOF

      - name: PREPROD Deployment Successful
        run: |
          echo "========================================"
          echo "     PREPROD DEPLOYMENT SUCCESSFUL"
          echo "========================================"
          echo "http://${{ secrets.PREPROD_HOST }}:8080/neontask-preprod"
name: PREPROD Deployment

on:
  push:
    branches:
      - preprod

jobs:
  build-and-deploy:

    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # CHECKOUT CODE
      # =====================================================

      - name: Checkout Code
        uses: actions/checkout@v4


      # =====================================================
      # JAVA 17
      # =====================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven


      # =====================================================
      # MAVEN BUILD
      # =====================================================

      - name: Build Java Application
        run: |
          mvn clean package


      # =====================================================
      # CHECK WAR
      # =====================================================

      - name: Check WAR File
        run: |
          echo "Checking generated WAR..."
          ls -lh target/
          test -f target/*.war
          echo "WAR file found successfully."


      # =====================================================
      # CHECK SECRETS
      # =====================================================

      - name: Check PREPROD Configuration
        run: |
          if [ -z "${{ secrets.PRE_PROD_HOST }}" ]; then
            echo "ERROR: PRE_PROD_HOST is empty"
            exit 1
          fi

          if [ -z "${{ secrets.PRE_PROD_SSH_KEY }}" ]; then
            echo "ERROR: PRE_PROD_SSH_KEY is empty"
            exit 1
          fi

          if [ -z "${{ secrets.PRE_PROD_USERNAME }}" ]; then
            echo "ERROR: PRE_PROD_USERNAME is empty"
            exit 1
          fi

          echo "PRE_PROD_HOST is configured"
          echo "PRE_PROD_SSH_KEY is configured"
          echo "PRE_PROD_USERNAME is configured"


      # =====================================================
      # CONFIGURE SSH
      # =====================================================

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh

          printf '%s\n' "${{ secrets.PRE_PROD_SSH_KEY }}" > ~/.ssh/preprod_key

          chmod 600 ~/.ssh/preprod_key

          ssh-keyscan -H "${{ secrets.PRE_PROD_HOST }}" >> ~/.ssh/known_hosts


      # =====================================================
      # TEST SSH CONNECTION
      # =====================================================

      - name: Test SSH Connection
        run: |
          ssh \
            -i ~/.ssh/preprod_key \
            -o StrictHostKeyChecking=yes \
            "${{ secrets.PRE_PROD_USERNAME }}@${{ secrets.PRE_PROD_HOST }}" \
            "echo 'SSH connection successful'"


      # =====================================================
      # COPY WAR TO PREPROD EC2
      # =====================================================

      - name: Copy WAR to PREPROD EC2
        run: |
          scp \
            -i ~/.ssh/preprod_key \
            -o StrictHostKeyChecking=yes \
            target/*.war \
            "${{ secrets.PRE_PROD_USERNAME }}@${{ secrets.PRE_PROD_HOST }}:/tmp/neontask-preprod.war"


      # =====================================================
      # DEPLOY WAR TO TOMCAT
      # =====================================================

      - name: Deploy to Tomcat
        run: |
          ssh \
            -i ~/.ssh/preprod_key \
            -o StrictHostKeyChecking=yes \
            "${{ secrets.PRE_PROD_USERNAME }}@${{ secrets.PRE_PROD_HOST }}" << 'EOF'

            echo "=========================================="
            echo "Starting PREPROD deployment"
            echo "=========================================="

            echo "Stopping Tomcat..."

            sudo systemctl stop tomcat || true


            echo "Removing old application..."

            sudo rm -rf /opt/tomcat/webapps/neontask-preprod

            sudo rm -f /opt/tomcat/webapps/neontask-preprod.war


            echo "Copying new WAR..."

            sudo mv \
              /tmp/neontask-preprod.war \
              /opt/tomcat/webapps/neontask-preprod.war


            echo "Setting permissions..."

            sudo chown \
              tomcat:tomcat \
              /opt/tomcat/webapps/neontask-preprod.war


            echo "Starting Tomcat..."

            sudo systemctl start tomcat


            echo "Waiting for Tomcat..."

            sleep 10


            echo "Checking Tomcat status..."

            sudo systemctl status tomcat --no-pager


            echo "=========================================="
            echo "PREPROD deployment completed successfully"
            echo "=========================================="

          EOF


      # =====================================================
      # DEPLOYMENT SUCCESS
      # =====================================================

      - name: PREPROD Deployment Successful
        run: |
          echo "=============================================="
          echo "       PREPROD DEPLOYMENT SUCCESSFUL"
          echo "=============================================="
          echo ""
          echo "Application URL:"
          echo "http://${{ secrets.PRE_PROD_HOST }}:8080/neontask-preprod"
          echo ""
          echo "Environment: PREPROD"
          echo "Tomcat Port: 8080"
          echo "=============================================="
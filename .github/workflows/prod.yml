name: PROD Deployment

on:
  push:
    branches:
      - prod

jobs:
  build-and-deploy:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build WAR
        run: mvn clean package

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_SSH_KEY }}" > ~/.ssh/prod_key
          chmod 600 ~/.ssh/prod_key
          ssh-keyscan -H ${{ secrets.PROD_HOST }} >> ~/.ssh/known_hosts

      - name: Copy WAR to PROD EC2
        run: |
          scp -i ~/.ssh/prod_key \
            target/*.war \
            ec2-user@${{ secrets.PROD_HOST }}:/tmp/neontask-prod.war

      - name: Deploy to Tomcat
        run: |
          ssh -i ~/.ssh/prod_key \
            ec2-user@${{ secrets.PROD_HOST }} << 'EOF'

            sudo systemctl stop tomcat

            sudo rm -rf /opt/tomcat/webapps/neontask-prod
            sudo rm -f /opt/tomcat/webapps/neontask-prod.war

            sudo mv /tmp/neontask-prod.war \
              /opt/tomcat/webapps/neontask-prod.war

            sudo chown tomcat:tomcat \
              /opt/tomcat/webapps/neontask-prod.war

            sudo systemctl start tomcat

            sudo systemctl status tomcat --no-pager

            echo "PROD deployment completed!"

          EOF


      - name: PROD Deployment Successful
        run: |
          echo "========================================"
          echo "       PROD DEPLOYMENT SUCCESSFUL"
          echo "========================================"
          echo "http://${{ secrets.PROD_HOST }}:8080/neontask-prod"